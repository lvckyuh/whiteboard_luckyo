<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whiteboard</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: crosshair;
  }

  #toolbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(250, 250, 250, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 18px;
    padding: 10px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 1000;
  }

  .swatch-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.12s ease;
    padding: 0;
  }

  .swatch:hover { transform: scale(1.15); }

  .swatch.active {
    border-color: #333;
    transform: scale(1.15);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.15);
  }

  #colorPicker {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    overflow: hidden;
  }
  #colorPicker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  #colorPicker::-webkit-color-swatch { border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; }
  #colorPicker::-moz-color-swatch { border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; }

  .divider {
    width: 1px;
    height: 26px;
    background: rgba(0,0,0,0.1);
  }

  #sizeSlider {
    width: 90px;
    accent-color: #333;
  }

  #sizePreviewWrap {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #sizePreview {
    border-radius: 50%;
    background: #000;
    transition: width 0.1s, height 0.1s;
  }

  button.tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.1);
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s;
  }

  button.tool-btn:hover { background: #f0f0f0; }
  button.tool-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    font-size: 12px;
    color: #999;
    z-index: 1000;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  #cornerLabel {
    position: fixed;
    bottom: 10px;
    left: 14px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #bbb;
    z-index: 1000;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="status">Loading…</div>
<div id="cornerLabel">for Luck and Ygz</div>

<div id="toolbar">
  <div class="swatch-group" id="swatches">
    <button class="swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
    <button class="swatch" data-color="#e03131" style="background:#e03131"></button>
    <button class="swatch" data-color="#2f9e44" style="background:#2f9e44"></button>
    <button class="swatch" data-color="#1971c2" style="background:#1971c2"></button>
    <button class="swatch" data-color="#f08c00" style="background:#f08c00"></button>
  </div>

  <input type="color" id="colorPicker" value="#1a1a1a" title="Custom color">

  <div class="divider"></div>

  <input type="range" id="sizeSlider" min="1" max="40" value="4">
  <div id="sizePreviewWrap"><div id="sizePreview"></div></div>

  <div class="divider"></div>

  <button class="tool-btn active" id="markerBtn" title="Marker">✏️</button>
  <button class="tool-btn" id="eraserBtn" title="Eraser">🧹</button>
  <button class="tool-btn" id="clearBtn" title="Clear all">🗑️</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  let color = '#1a1a1a';
  let brushSize = 4;
  let tool = 'marker'; // 'marker' | 'eraser'
  let drawing = false;
  let lastX = 0, lastY = 0;

  const STORAGE_KEY = 'whiteboard-drawing';
  let saveTimeout = null;

  function setStatus(text, fade) {
    statusEl.textContent = text;
    statusEl.style.opacity = '1';
    if (fade) {
      clearTimeout(setStatus._t);
      setStatus._t = setTimeout(() => { statusEl.style.opacity = '0'; }, 1200);
    }
  }

  // Resize canvas while preserving existing drawing
  function resizeCanvas() {
    const dataURL = (canvas.width && canvas.height) ? canvas.toDataURL() : null;
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (dataURL) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, w, h);
      img.src = dataURL;
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    // draw a dot for single clicks/taps
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.fill();
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = tool === 'eraser' ? brushSize * 3 : brushSize;
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function endDraw() {
    if (!drawing) return;
    drawing = false;
    scheduleSave();
  }

  function scheduleSave() {
    clearTimeout(saveTimeout);
    setStatus('Saving…');
    saveTimeout = setTimeout(saveDrawing, 400);
  }

  async function saveDrawing() {
    try {
      const dataURL = canvas.toDataURL('image/png');
      const result = await window.storage.set(STORAGE_KEY, dataURL, false);
      if (result) {
        setStatus('Saved', true);
      } else {
        setStatus('Save failed', true);
      }
    } catch (err) {
      console.error('Save error:', err);
      setStatus('Save failed', true);
    }
  }

  async function loadDrawing() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      if (result && result.value) {
        const img = new Image();
        img.onload = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          ctx.drawImage(img, 0, 0, w, h);
          setStatus('Loaded', true);
        };
        img.src = result.value;
      } else {
        setStatus('Ready', true);
      }
    } catch (err) {
      // key not found or other error - treat as blank board
      setStatus('Ready', true);
    }
  }

  // Pointer events (covers mouse + touch + pen uniformly where supported)
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);

  window.addEventListener('resize', resizeCanvas);

  // Toolbar interactions
  const swatches = document.querySelectorAll('.swatch');
  swatches.forEach(sw => {
    sw.addEventListener('click', () => {
      swatches.forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
      tool = 'marker';
      updateToolButtons();
    });
  });

  const colorPicker = document.getElementById('colorPicker');
  colorPicker.addEventListener('input', () => {
    color = colorPicker.value;
    swatches.forEach(s => s.classList.remove('active'));
    tool = 'marker';
    updateToolButtons();
  });

  const sizeSlider = document.getElementById('sizeSlider');
  const sizePreview = document.getElementById('sizePreview');
  function updateSizePreview() {
    const s = Math.max(4, Math.min(26, brushSize));
    sizePreview.style.width = s + 'px';
    sizePreview.style.height = s + 'px';
    sizePreview.style.background = tool === 'eraser' ? '#ccc' : color;
  }
  sizeSlider.addEventListener('input', () => {
    brushSize = parseInt(sizeSlider.value, 10);
    updateSizePreview();
  });

  const markerBtn = document.getElementById('markerBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');

  function updateToolButtons() {
    markerBtn.classList.toggle('active', tool === 'marker');
    eraserBtn.classList.toggle('active', tool === 'eraser');
    updateSizePreview();
  }

  markerBtn.addEventListener('click', () => { tool = 'marker'; updateToolButtons(); });
  eraserBtn.addEventListener('click', () => { tool = 'eraser'; updateToolButtons(); });

  clearBtn.addEventListener('click', () => {
    if (confirm('Clear the whole whiteboard? This cannot be undone.')) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      scheduleSave();
    }
  });

  // Init
  resizeCanvas();
  updateSizePreview();
  loadDrawing();
})();
</script>

</body>
</html>
