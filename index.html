<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whiteboard</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="canvas"></canvas>
<div id="status">Loading…</div>
<div id="cornerLabel">for Luck and Ygz</div>

<!-- Password gate: covers everything until the correct password is entered.
     NOTE: this is a soft/casual gate, not real security — the password
     lives in this file's source code, so anyone who views page source
     can find it. Fine for keeping casual visitors out of a friends'
     board; don't rely on it for anything sensitive. -->
<div id="passwordGate">
  <div id="passwordBox">
    <h2>Private Whiteboard</h2>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    <button id="passwordSubmit">Enter</button>
    <p id="passwordError">Incorrect password — try again.</p>
  </div>
</div>

<div id="toolbar">
  <div class="swatch-group" id="swatches">
    <button class="swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
    <button class="swatch" data-color="#E4002B" style="background:#E4002B"></button>
    <button class="swatch" data-color="#1cb981" style="background:#1cb981"></button>
    <button class="swatch" data-color="#003087" style="background:#003087"></button>
    <button class="swatch" data-color="#ff8da1" style="background:#ff8da1"></button>
  </div>

  <input type="color" id="colorPicker" value="#1a1a1a" title="Custom color">

  <div class="divider"></div>

  <input type="range" id="sizeSlider" min="1" max="40" value="4">
  <div id="sizePreviewWrap"><div id="sizePreview"></div></div>

  <div class="divider"></div>

  <!--
    TODO: Replace these emoji characters with <img> tags when you have
    icon images ready, e.g.:
    <button class="tool-btn active" id="markerBtn" title="Marker">
      <img src="icons/marker.png" class="tool-icon" alt="Marker">
    </button>
    Keep the id, class, and title attributes the same so the JS below
    still works without any changes.
  -->
  <button class="tool-btn active" id="markerBtn" title="Marker">✏️</button>
  <button class="tool-btn" id="eraserBtn" title="Eraser">🧹</button>

  <div class="divider"></div>

  <button class="tool-btn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
  <button class="tool-btn" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button>

  <div class="divider"></div>

  <button class="tool-btn" id="clearBtn" title="Clear all">🗑️</button>
</div>

<!-- Firebase SDKs (loaded as ES modules straight from Google's CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, set, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // =====================================================================
  // REPLACE WITH YOUR OWN FIREBASE CONFIG (see instructions comment at
  // the top of this file for how to get these values).
  // =====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAU6fV8_YBbPJRn1Z05dC8f62YrDerCSfM",
    authDomain: "whiteboard-903ab.firebaseapp.com",
    databaseURL: "https://whiteboard-903ab-default-rtdb.firebaseio.com",
    projectId: "whiteboard-903ab",
    storageBucket: "whiteboard-903ab.firebasestorage.app",
    messagingSenderId: "1039300649038",
    appId: "1:1039300649038:web:7c742afcfaa3b8836f631f",
    measurementId: "G-FR2293LS3M"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // =====================================================================
  // PASSWORD GATE (soft/casual protection — see note near the markup)
  // TODO: change this to whatever password you want your friends to use.
  // =====================================================================
  const BOARD_PASSWORD = "luckiscool";

  const passwordGate = document.getElementById('passwordGate');
  const passwordInput = document.getElementById('passwordInput');
  const passwordSubmit = document.getElementById('passwordSubmit');
  const passwordError = document.getElementById('passwordError');

  function tryUnlock() {
    if (passwordInput.value === BOARD_PASSWORD) {
      passwordGate.style.display = 'none';
    } else {
      passwordError.style.display = 'block';
      passwordInput.value = '';
      passwordInput.focus();
    }
  }
  passwordSubmit.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
  passwordInput.focus();

  // The whole board is stored at one location (one PNG snapshot).
  // Simple and reliable for a casual shared whiteboard.
  const boardRef = ref(db, 'whiteboard/shared-board');

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  let color = '#1a1a1a';
  let brushSize = 4;
  let tool = 'marker'; // 'marker' | 'eraser'
  let drawing = false;
  let lastX = 0, lastY = 0;
  let suppressNextRemoteRedraw = false; // avoid re-rendering our own save
  let saveTimeout = null;

  // ---- Undo / redo history ----
  // We snapshot the canvas (as a dataURL) right before each stroke or
  // clear begins. Undo pops the most recent snapshot and restores it
  // (pushing the current state onto the redo stack); redo does the
  // reverse. Capped so memory doesn't grow forever on a long session.
  const HISTORY_LIMIT = 50;
  let undoStack = [];
  let redoStack = [];
  let strokeSnapshotPending = false; // true from mousedown until we've captured the "before" state

  function setStatus(text, fade) {
    statusEl.textContent = text;
    statusEl.style.opacity = '1';
    if (fade) {
      clearTimeout(setStatus._t);
      setStatus._t = setTimeout(() => { statusEl.style.opacity = '0'; }, 1200);
    }
  }

  // Resize canvas while preserving existing drawing
  function resizeCanvas() {
    const dataURL = (canvas.width && canvas.height) ? canvas.toDataURL() : null;
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (dataURL) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, w, h);
      img.src = dataURL;
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function pushUndoSnapshot() {
    undoStack.push(canvas.toDataURL());
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = []; // a new action invalidates the redo history
    updateUndoRedoButtons();
  }

  function restoreFromDataURL(dataURL) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve();
      };
      img.src = dataURL;
    });
  }

  async function undo() {
    if (undoStack.length === 0) return;
    const prev = undoStack.pop();
    redoStack.push(canvas.toDataURL());
    if (redoStack.length > HISTORY_LIMIT) redoStack.shift();
    await restoreFromDataURL(prev);
    updateUndoRedoButtons();
    scheduleSave();
  }

  async function redo() {
    if (redoStack.length === 0) return;
    const next = redoStack.pop();
    undoStack.push(canvas.toDataURL());
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    await restoreFromDataURL(next);
    updateUndoRedoButtons();
    scheduleSave();
  }

  function updateUndoRedoButtons() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    if (!strokeSnapshotPending) {
      pushUndoSnapshot();
      strokeSnapshotPending = true;
    }
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.fill();
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = tool === 'eraser' ? brushSize * 3 : brushSize;
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function endDraw() {
    if (!drawing) return;
    drawing = false;
    strokeSnapshotPending = false;
    scheduleSave();
  }

  function scheduleSave() {
    clearTimeout(saveTimeout);
    setStatus('Saving…');
    saveTimeout = setTimeout(saveDrawing, 400);
  }

  async function saveDrawing() {
    try {
      const dataURL = canvas.toDataURL('image/png');
      suppressNextRemoteRedraw = true;

      const savePromise = set(boardRef, { image: dataURL, updatedAt: Date.now() });
      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Save timed out after 8s')), 8000)
      );

      await Promise.race([savePromise, timeoutPromise]);
      setStatus('Saved', true);
    } catch (err) {
      console.error('Save error:', err);
      suppressNextRemoteRedraw = false;
      setStatus('Save failed — open console (F12) for details', true);
    }
  }

  // Real-time listener: redraws the board whenever ANYONE (including
  // people on other devices) saves a new version.
  function listenForUpdates() {
    onValue(boardRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        setStatus('Ready', true);
        return;
      }
      // Don't redraw from the update we just triggered ourselves —
      // avoids a flicker right after saving.
      if (suppressNextRemoteRedraw) {
        suppressNextRemoteRedraw = false;
        return;
      }
      // Don't interrupt the person mid-stroke.
      if (drawing) return;

      if (!data.image) return;
      const img = new Image();
      img.onload = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        setStatus('Updated', true);
      };
      img.src = data.image;
    }, (err) => {
      console.error('Sync error:', err);
      setStatus('Sync failed — check Firebase config', true);
    });
  }

  // Pointer events (mouse + touch)
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);

  window.addEventListener('resize', resizeCanvas);

  // Toolbar interactions
  const swatches = document.querySelectorAll('.swatch');
  swatches.forEach(sw => {
    sw.addEventListener('click', () => {
      swatches.forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
      tool = 'marker';
      updateToolButtons();
    });
  });

  const colorPicker = document.getElementById('colorPicker');
  colorPicker.addEventListener('input', () => {
    color = colorPicker.value;
    swatches.forEach(s => s.classList.remove('active'));
    tool = 'marker';
    updateToolButtons();
  });

  const sizeSlider = document.getElementById('sizeSlider');
  const sizePreview = document.getElementById('sizePreview');
  function updateSizePreview() {
    const s = Math.max(4, Math.min(26, brushSize));
    sizePreview.style.width = s + 'px';
    sizePreview.style.height = s + 'px';
    sizePreview.style.background = tool === 'eraser' ? '#ccc' : color;
  }
  sizeSlider.addEventListener('input', () => {
    brushSize = parseInt(sizeSlider.value, 10);
    updateSizePreview();
  });

  const markerBtn = document.getElementById('markerBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');

  function updateToolButtons() {
    markerBtn.classList.toggle('active', tool === 'marker');
    eraserBtn.classList.toggle('active', tool === 'eraser');
    updateSizePreview();
  }

  markerBtn.addEventListener('click', () => { tool = 'marker'; updateToolButtons(); });
  eraserBtn.addEventListener('click', () => { tool = 'eraser'; updateToolButtons(); });

  clearBtn.addEventListener('click', () => {
    if (confirm('Clear the whole whiteboard for EVERYONE? This cannot be undone.')) {
      pushUndoSnapshot();
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      scheduleSave();
    }
  });

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  // Keyboard shortcuts: Ctrl+Z / Cmd+Z to undo, Ctrl+Shift+Z / Cmd+Shift+Z
  // (and Ctrl+Y, the common Windows redo shortcut) to redo.
  window.addEventListener('keydown', (e) => {
    const cmdOrCtrl = e.metaKey || e.ctrlKey;
    if (!cmdOrCtrl) return;

    const key = e.key.toLowerCase();

    if (key === 'z' && e.shiftKey) {
      e.preventDefault();
      redo();
    } else if (key === 'z') {
      e.preventDefault();
      undo();
    } else if (key === 'y') {
      e.preventDefault();
      redo();
    }
  });

  // Init
  resizeCanvas();
  updateSizePreview();
  updateUndoRedoButtons();
  listenForUpdates();
</script>

</body>
</html>
