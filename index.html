<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whiteboard</title>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #canvas {
    display: block;
    background: #ffffff;
    touch-action: none;
    cursor: crosshair;
  }

  #toolbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(250, 250, 250, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 18px;
    padding: 10px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 1000;
  }

  .swatch-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.12s ease;
    padding: 0;
  }

  .swatch:hover { transform: scale(1.15); }

  .swatch.active {
    border-color: #333;
    transform: scale(1.15);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.15);
  }

  #colorPicker {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    overflow: hidden;
  }
  #colorPicker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  #colorPicker::-webkit-color-swatch { border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; }
  #colorPicker::-moz-color-swatch { border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; }

  .divider {
    width: 1px;
    height: 26px;
    background: rgba(0,0,0,0.1);
  }

  #sizeSlider {
    width: 90px;
    accent-color: #333;
  }

  #sizePreviewWrap {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #sizePreview {
    border-radius: 50%;
    background: #000;
    transition: width 0.1s, height 0.1s;
  }

  button.tool-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.1);
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s;
  }

  button.tool-btn:hover { background: #f0f0f0; }
  button.tool-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  /* If you replace the emoji with an <img>, this keeps it sized nicely.
     e.g. <img src="marker-icon.png" class="tool-icon"> instead of the emoji text */
  .tool-icon {
    width: 18px;
    height: 18px;
    object-fit: contain;
    pointer-events: none;
  }

  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    font-size: 12px;
    color: #999;
    z-index: 1000;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  #cornerLabel {
    position: fixed;
    bottom: 10px;
    left: 14px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #bbb;
    z-index: 1000;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="status">Loading…</div>
<div id="cornerLabel">for Luck and Ygz</div>

<div id="toolbar">
  <div class="swatch-group" id="swatches">
    <button class="swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
    <button class="swatch" data-color="#e03131" style="background:#e03131"></button>
    <button class="swatch" data-color="#2f9e44" style="background:#2f9e44"></button>
    <button class="swatch" data-color="#1971c2" style="background:#1971c2"></button>
    <button class="swatch" data-color="#f08c00" style="background:#f08c00"></button>
  </div>

  <input type="color" id="colorPicker" value="#1a1a1a" title="Custom color">

  <div class="divider"></div>

  <input type="range" id="sizeSlider" min="1" max="40" value="4">
  <div id="sizePreviewWrap"><div id="sizePreview"></div></div>

  <div class="divider"></div>

  <!--
    TODO: Replace these emoji characters with <img> tags when you have
    icon images ready, e.g.:
    <button class="tool-btn active" id="markerBtn" title="Marker">
      <img src="icons/marker.png" class="tool-icon" alt="Marker">
    </button>
    Keep the id, class, and title attributes the same so the JS below
    still works without any changes.
  -->
  <button class="tool-btn active" id="markerBtn" title="Marker">✏️</button>
  <button class="tool-btn" id="eraserBtn" title="Eraser">🧹</button>
  <button class="tool-btn" id="clearBtn" title="Clear all">🗑️</button>
</div>

<!-- Firebase SDKs (loaded as ES modules straight from Google's CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, set, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // =====================================================================
  // REPLACE WITH YOUR OWN FIREBASE CONFIG (see instructions comment at
  // the top of this file for how to get these values).
  // =====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAU6fV8_YBbPJRn1Z05dC8f62YrDerCSfM",
    authDomain: "whiteboard-903ab.firebaseapp.com",
    databaseURL: "https://whiteboard-903ab-default-rtdb.firebaseio.com",
    projectId: "whiteboard-903ab",
    storageBucket: "whiteboard-903ab.firebasestorage.app",
    messagingSenderId: "1039300649038",
    appId: "1:1039300649038:web:7c742afcfaa3b8836f631f",
    measurementId: "G-FR2293LS3M"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // The whole board is stored at one location (one PNG snapshot).
  // Simple and reliable for a casual shared whiteboard.
  const boardRef = ref(db, 'whiteboard/shared-board');

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  let color = '#1a1a1a';
  let brushSize = 4;
  let tool = 'marker'; // 'marker' | 'eraser'
  let drawing = false;
  let lastX = 0, lastY = 0;
  let suppressNextRemoteRedraw = false; // avoid re-rendering our own save
  let saveTimeout = null;

  function setStatus(text, fade) {
    statusEl.textContent = text;
    statusEl.style.opacity = '1';
    if (fade) {
      clearTimeout(setStatus._t);
      setStatus._t = setTimeout(() => { statusEl.style.opacity = '0'; }, 1200);
    }
  }

  // Resize canvas while preserving existing drawing
  function resizeCanvas() {
    const dataURL = (canvas.width && canvas.height) ? canvas.toDataURL() : null;
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (dataURL) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, w, h);
      img.src = dataURL;
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length) {
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.fill();
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
    ctx.lineWidth = tool === 'eraser' ? brushSize * 3 : brushSize;
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function endDraw() {
    if (!drawing) return;
    drawing = false;
    scheduleSave();
  }

  function scheduleSave() {
    clearTimeout(saveTimeout);
    setStatus('Saving…');
    saveTimeout = setTimeout(saveDrawing, 400);
  }

  async function saveDrawing() {
    try {
      const dataURL = canvas.toDataURL('image/png');
      suppressNextRemoteRedraw = true;

      const savePromise = set(boardRef, { image: dataURL, updatedAt: Date.now() });
      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Save timed out after 8s')), 8000)
      );

      await Promise.race([savePromise, timeoutPromise]);
      setStatus('Saved', true);
    } catch (err) {
      console.error('Save error:', err);
      suppressNextRemoteRedraw = false;
      setStatus('Save failed — open console (F12) for details', true);
    }
  }

  // Real-time listener: redraws the board whenever ANYONE (including
  // people on other devices) saves a new version.
  function listenForUpdates() {
    onValue(boardRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        setStatus('Ready', true);
        return;
      }
      // Don't redraw from the update we just triggered ourselves —
      // avoids a flicker right after saving.
      if (suppressNextRemoteRedraw) {
        suppressNextRemoteRedraw = false;
        return;
      }
      // Don't interrupt the person mid-stroke.
      if (drawing) return;

      if (!data.image) return;
      const img = new Image();
      img.onload = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        setStatus('Updated', true);
      };
      img.src = data.image;
    }, (err) => {
      console.error('Sync error:', err);
      setStatus('Sync failed — check Firebase config', true);
    });
  }

  // Pointer events (mouse + touch)
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);

  window.addEventListener('resize', resizeCanvas);

  // Toolbar interactions
  const swatches = document.querySelectorAll('.swatch');
  swatches.forEach(sw => {
    sw.addEventListener('click', () => {
      swatches.forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
      tool = 'marker';
      updateToolButtons();
    });
  });

  const colorPicker = document.getElementById('colorPicker');
  colorPicker.addEventListener('input', () => {
    color = colorPicker.value;
    swatches.forEach(s => s.classList.remove('active'));
    tool = 'marker';
    updateToolButtons();
  });

  const sizeSlider = document.getElementById('sizeSlider');
  const sizePreview = document.getElementById('sizePreview');
  function updateSizePreview() {
    const s = Math.max(4, Math.min(26, brushSize));
    sizePreview.style.width = s + 'px';
    sizePreview.style.height = s + 'px';
    sizePreview.style.background = tool === 'eraser' ? '#ccc' : color;
  }
  sizeSlider.addEventListener('input', () => {
    brushSize = parseInt(sizeSlider.value, 10);
    updateSizePreview();
  });

  const markerBtn = document.getElementById('markerBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');

  function updateToolButtons() {
    markerBtn.classList.toggle('active', tool === 'marker');
    eraserBtn.classList.toggle('active', tool === 'eraser');
    updateSizePreview();
  }

  markerBtn.addEventListener('click', () => { tool = 'marker'; updateToolButtons(); });
  eraserBtn.addEventListener('click', () => { tool = 'eraser'; updateToolButtons(); });

  clearBtn.addEventListener('click', () => {
    if (confirm('Clear the whole whiteboard for EVERYONE? This cannot be undone.')) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      scheduleSave();
    }
  });

  // Init
  resizeCanvas();
  updateSizePreview();
  listenForUpdates();
</script>

</body>
</html>
